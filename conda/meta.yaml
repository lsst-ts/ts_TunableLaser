{% set data= load_setup_py_data() %}
package:
  name: ts-tunablelaser
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{PYTHON}} -m pip install --no-deps --ignore-installed .
  string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"
  entry_points:
    - run_tunablelaser = lsst.ts.tunablelaser:run_tunablelaser

test:
  requires:
    - ts-conda-build =0.5
    - ts-xml {{ xml_version }}
    - ts-salobj {{ salobj_version }}
    - parameterized
  source_files:
    - python
    - bin
    - tests
    - pyproject.toml
  commands:
    - pytest

requirements:
  host:
    - python {{python}}
    - setuptools_scm ={{setuptools_scm}}
    - setuptools >={{setuptools}}
  run:
    - python {{python}}
    - setuptools
    - setuptools_scm
    - ts-salobj
    - ts-xml
    - ts-tcpip
